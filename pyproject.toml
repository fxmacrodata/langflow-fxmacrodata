[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "lfx-fxmacrodata"
version = "0.1.0"
description = "Native FXMacroData research integration for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fxmacrodata-public-client==0.1.0", "lfx>=1.12.1,<2", "langchain-core>=1.2.28,<2"]

[project.urls]
Homepage = "https://fxmacrodata.com"
Documentation = "https://fxmacrodata.com/documentation/reference"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_fxmacrodata"]

[tool.hatch.build.targets.sdist]
include = ["src/lfx_fxmacrodata/**", "README.md", "LICENSE", "pyproject.toml", "examples/**", "tests/**", "CAPABILITIES.md", "PUBLIC_FILES.json", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[project.entry-points."langflow.extensions"]
lfx-fxmacrodata = "lfx_fxmacrodata"
